version: "2.1"

# Xibo CMS — maximonitor.ticomercio.com.br (Coolify / apoiopharma.cloud)
# Upgrade 4.4.0 -> 4.5.3 | xmr 1.0 -> 1.3
# Mudanças em relação à versão anterior deste arquivo:
#   * cms-web: imagem release-4.5.3 (antes release-4.4.0)
#   * cms-xmr: imagem 1.3 (antes 1.0)
#   * removido o volume ./shared/cms/web/theme/custom (não existe mais na 4.5; branding em library/brand)
#   * adicionado healthcheck no cms-web (Coolify passa a mostrar healthy/unhealthy em vez de "unknown")
#   * mantidos: portas 85:80 e 9505:9505, env_file config.env, variáveis ${MYSQL_*} e ${SERVICE_*}
#   Se o pull de release-4.5.3 falhar no deploy, trocar para release-4.5.2 (mesmo procedimento).

services:
  cms-db:
    image: mysql:8.4
    restart: always
    mem_limit: 1g
    env_file: config.env
    environment:
      # Garante que o MySQL use os valores do config.env (Coolify)
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./shared/db:/var/lib/mysql:Z

  cms-xmr:
    image: ghcr.io/xibosignage/xibo-xmr:1.3
    restart: always
    mem_limit: 256m
    env_file: config.env
    ports:
      - "9505:9505"

  cms-web:
    image: ghcr.io/xibosignage/xibo-cms:release-4.5.3
    restart: always
    mem_limit: 1g
    env_file: config.env
    environment:
      - MYSQL_HOST=cms-db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

      - XMR_HOST=cms-xmr

      - CMS_USE_MEMCACHED=true
      - MEMCACHED_HOST=cms-memcached
      - SERVER_NAME=${SERVICE_FQDN_CMS_WEB}
      - CMS_URL=${SERVICE_URL_CMS_WEB}

    ports:
      - "85:80"
    volumes:
      - ./shared/cms/custom:/var/www/cms/custom:Z
      - ./shared/backup:/var/www/backup:Z
      - ./shared/cms/library:/var/www/cms/library:Z
      - ./shared/cms/web/userscripts:/var/www/cms/web/userscripts:Z
      - ./shared/cms/ca-certs:/var/www/cms/ca-certs:Z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/login"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s

  cms-memcached:
    image: memcached:alpine
    restart: always
    mem_limit: 100M
    command: memcached -m 15

  cms-quickchart:
    image: ianw/quickchart
    restart: always
